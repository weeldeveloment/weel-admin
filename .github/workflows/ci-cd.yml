name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

  release-and-deploy:
    name: Release & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: Package dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Configure git
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version
        id: version
        run: |
          # If HEAD is already tagged (re-run), reuse that tag instead of bumping.
          HEAD_TAG="$(git tag --points-at HEAD | grep '^v' | head -1 || true)"
          if [ -n "$HEAD_TAG" ]; then
            echo "tag=$HEAD_TAG" >> $GITHUB_OUTPUT
            echo "version=$(echo "$HEAD_TAG" | sed 's/^v//')" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION_TAG="$(git tag --sort=-v:refname | grep '^v' | head -1 || true)"
          if [ -z "$VERSION_TAG" ]; then
            VERSION="0.0.0"
          else
            VERSION="$(echo "$VERSION_TAG" | sed 's/^v//')"
          fi
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          PATCH="$(echo "$VERSION" | cut -d. -f3)"
          PATCH="$((PATCH + 1))"
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ steps.version.outputs.tag }} (skipping create)"
            exit 0
          fi
          git tag "${{ steps.version.outputs.tag }}"

      - name: Push git tag
        run: git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" dist.tar.gz --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" dist.tar.gz --title "${{ steps.version.outputs.tag }}" --generate-notes
          fi

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Missing secret: DOKPLOY_WEBHOOK_URL"
            exit 1
          fi
          curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
