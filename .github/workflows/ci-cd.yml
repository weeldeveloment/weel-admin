name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

  docker-deploy:
    name: Docker Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag_sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
            CACHEBUST=${{ github.sha }}
            DEPLOY_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          # Preferred: deployment webhook (no Dokploy API key required).
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            set -euo pipefail
            # Include applicationId and the exact image tag so Dokploy can deploy the correct image
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
            SHA_TAG="sha-${GITHUB_SHA}"
            payload=$(printf '{"applicationId":"%s","image":"%s","tag":"%s","ref":"%s","repository":{"full_name":"%s"}}' \
              "$DOKPLOY_APPLICATION_ID" "$IMAGE" "$SHA_TAG" "$GITHUB_REF" "$GITHUB_REPOSITORY")

            # Send payload (use --data-raw to avoid curl interpreting @)
            response=$(curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              --data-raw "$payload" || true)
            echo "Dokploy response: $response"
            exit 0
          fi

          # Optional fallback: Dokploy API redeploy (requires API key).
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Missing secrets: set DOKPLOY_WEBHOOK_URL or (DOKPLOY_URL + DOKPLOY_API_KEY + DOKPLOY_APPLICATION_ID)"
            exit 1
          fi

          response="$(curl -sS -X POST "${DOKPLOY_URL%/}/api/application.redeploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}")"
          echo "$response"
