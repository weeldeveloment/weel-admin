name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

  # `ci` job'i committed tiplarga qarab build qiladi — backend o'zgargan bo'lsa
  # ham u yashil qolaveradi va nomuvofiqlik faqat prodda ko'rinadi. Bu job
  # tiplarni deploy qilinadigan backenddan (weel-backend-v2 main) qayta
  # generatsiya qilib, kod yangi kontraktga mos kelishini va committed tiplar
  # eskirmaganini tekshiradi.
  contract:
    name: API kontrakti
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Backend repo tokenini tekshirish
        run: |
          if [ -z "${{ secrets.BACKEND_REPO_TOKEN }}" ]; then
            echo "::error::BACKEND_REPO_TOKEN sekreti yo'q."
            echo "::error::Usiz backend sxemasini olib bo'lmaydi va tiplar"
            echo "::error::eskirganini bilib bo'lmaydi, shuning uchun to'xtatildi."
            echo "::error::weeldeveloment tashkilotida 'Contents: Read-only'"
            echo "::error::huquqli fine-grained token yarating va shu repoga qo'shing."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: weel-admin

      # generate:openapi-types `cd ../weel-backend-v2` qiladi, shuning uchun
      # ikkalasi yonma-yon turishi shart.
      - uses: actions/checkout@v4
        with:
          repository: weeldeveloment/weel-backend-v2
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: weel-backend-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.1.0

      - name: Install backend dependencies
        working-directory: weel-backend-v2
        run: poetry install --no-root --no-ansi

      # Generatsiya skripti `${PYTHON:-venv/bin/python}` ishlatadi; CI'da venv yo'q.
      - name: Resolve Python path
        working-directory: weel-backend-v2
        run: echo "PYTHON=$(poetry env info --path)/bin/python" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: weel-admin
        run: bun install --frozen-lockfile

      - name: Tiplarni backenddan qayta generatsiya qilish
        working-directory: weel-admin
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS: example.com
          REDIS_CONNECTION_STRING: redis://localhost:6379/0
        run: bun run generate:openapi-types

      - name: Kod yangi kontraktga mos keladimi
        working-directory: weel-admin
        run: bunx tsc --noEmit

      - name: Committed tiplar eskirmaganmi
        working-directory: weel-admin
        run: |
          if ! git diff --quiet src/types/; then
            echo "::error::src/types/ dagi tiplar backenddan orqada qolgan."
            echo "::error::Lokal ravishda \`bun run generate:openapi-types\` ni"
            echo "::error::ishlatib, natijani commit qiling. Farq:"
            git diff --stat src/types/
            exit 1
          fi
          echo "✅ Tiplar backend bilan bir xil."

  docker-deploy:
    name: Docker Deploy
    runs-on: ubuntu-latest
    needs: [ci, contract]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag_sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
            CACHEBUST=${{ github.sha }}
            DEPLOY_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        run: |
          PKG="weel-admin"
          echo "== Debug: list packages visible to GITHUB_TOKEN =="
          curl -sS "https://api.github.com/user/packages?package_type=container" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" | head -c 2000
          echo ""
          echo "== Try org endpoint =="
          curl -sS -o /tmp/resp.json -w "HTTP %{http_code}\n" \
            -X PATCH "https://api.github.com/orgs/weeldeveloment/packages/container/${PKG}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"visibility":"public"}'
          cat /tmp/resp.json
          echo ""
          echo "== Try repo endpoint =="
          curl -sS -o /tmp/resp2.json -w "HTTP %{http_code}\n" \
            -X PATCH "https://api.github.com/repos/weeldeveloment/weel-admin/packages/container/${PKG}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"visibility":"public"}'
          cat /tmp/resp2.json

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          # Preferred: deployment webhook (no Dokploy API key required).
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            set -euo pipefail
            # Include applicationId and the exact image tag so Dokploy can deploy the correct image
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
            SHA_TAG="sha-${GITHUB_SHA}"
            payload=$(printf '{"applicationId":"%s","image":"%s","tag":"%s","ref":"%s","repository":{"full_name":"%s"}}' \
              "$DOKPLOY_APPLICATION_ID" "$IMAGE" "$SHA_TAG" "$GITHUB_REF" "$GITHUB_REPOSITORY")

            # Send payload (use --data-raw to avoid curl interpreting @)
            response=$(curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              --data-raw "$payload" || true)
            echo "Dokploy response: $response"
            exit 0
          fi

          # Optional fallback: Dokploy API redeploy (requires API key).
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Missing secrets: set DOKPLOY_WEBHOOK_URL or (DOKPLOY_URL + DOKPLOY_API_KEY + DOKPLOY_APPLICATION_ID)"
            exit 1
          fi

          response="$(curl -sS -X POST "${DOKPLOY_URL%/}/api/application.redeploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}")"
          echo "$response"


